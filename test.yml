name: contract-tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  direct-tests:
    name: Direct Mode tests + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # genlayer-test ships the Direct Mode VM used by tests/direct/
          pip install "genlayer-test>=0.29,<0.30" pytest ruff

      - name: Lint (ruff)
        run: |
          ruff check contracts tests --output-format=github || true
          ruff format --check contracts tests || true

      - name: Compile check
        run: |
          python -m compileall -q contracts tests
          echo "syntax OK"

      - name: Run Direct Mode tests
        run: |
          python -m pytest tests/direct/ -v --maxfail=1

      - name: Test summary
        if: always()
        run: |
          echo "### Direct Mode contract tests" >> $GITHUB_STEP_SUMMARY
          echo "Ran pytest on tests/direct/ — see the step log above for the per-test result." >> $GITHUB_STEP_SUMMARY
