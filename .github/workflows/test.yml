name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "genlayer-test>=0.29,<0.30" pytest ruff
      - run: ruff check contracts tests
      - run: pytest tests/direct/ -v --maxfail=1
